<html lang="es">
<head>
<meta charset="UTF-8">

<title>AK Studio · Panel de Prospectos</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
  header{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
  header h1{font-size:17px;font-weight:600;color:#f8fafc;letter-spacing:.3px}
  header .sub{font-size:13px;color:#64748b;margin-left:auto}
  .stats{display:flex;gap:10px;margin-left:auto}
  .stat{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:6px 14px;font-size:12px;color:#94a3b8;text-align:center}
  .stat b{display:block;font-size:18px;font-weight:700;color:#38bdf8}
  .layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 57px)}
  .sidebar{width:320px;min-width:280px;border-right:1px solid #334155;overflow-y:auto;background:#1e293b}
  .search-box{padding:12px;border-bottom:1px solid #334155;position:sticky;top:0;background:#1e293b;z-index:10}
  .search-box input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#e2e8f0;font-size:13px;outline:none}
  .search-box input:focus{border-color:#38bdf8}
  .filters{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #334155;flex-wrap:wrap;background:#1e293b;position:sticky;top:52px;z-index:9}
  .chip{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid #334155;cursor:pointer;color:#94a3b8;background:transparent;transition:all .15s}
  .chip.active,.chip:hover{background:#38bdf8;color:#0f172a;border-color:#38bdf8;font-weight:600}
  .contact-item{padding:12px 14px;border-bottom:1px solid #1e293b;cursor:pointer;transition:background .1s;position:relative}
  .contact-item:hover{background:#263348}
  .contact-item.active{background:#1d3a5a;border-left:3px solid #38bdf8}
  .contact-item .name{font-size:13px;font-weight:600;color:#f1f5f9;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contact-item .email-addr{font-size:11px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contact-item .tag{font-size:10px;padding:2px 7px;border-radius:20px;margin-top:5px;display:inline-block;font-weight:600}
  .tag-construccion{background:#1e3a2f;color:#4ade80}
  .tag-diseno{background:#1e2a3a;color:#60a5fa}
  .tag-inversion{background:#2d1e3a;color:#c084fc}
  .tag-tecnico{background:#3a2d1e;color:#fb923c}
  .sent-badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#166534;color:#4ade80;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#475569;gap:12px}
  .empty-state .icon{font-size:48px;opacity:.4}
  .preview-header{padding:20px 24px 0;border-bottom:1px solid #334155;background:#1e293b}
  .preview-header .pname{font-size:20px;font-weight:700;color:#f8fafc;margin-bottom:4px}
  .preview-header .pemail{font-size:13px;color:#38bdf8;margin-bottom:12px}
  .meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .meta-pill{font-size:11px;padding:3px 10px;border-radius:20px;background:#0f172a;border:1px solid #334155;color:#94a3b8}
  .action-bar{display:flex;gap:10px;padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155;align-items:center;flex-wrap:wrap}
  .btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;display:flex;align-items:center;gap:6px}
  .btn-primary{background:#0ea5e9;color:#fff}
  .btn-primary:hover{background:#0284c7}
  .btn-secondary{background:#1e293b;color:#94a3b8;border:1px solid #334155}
  .btn-secondary:hover{background:#263348;color:#e2e8f0}
  .btn-success{background:#166534;color:#4ade80}
  .btn-success:hover{background:#14532d}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-mailto{background:#7c3aed;color:#fff}
  .btn-mailto:hover{background:#6d28d9}
  .subject-box{flex:1;min-width:200px}
  .subject-box label{font-size:11px;color:#64748b;display:block;margin-bottom:4px}
  .subject-box span{font-size:13px;color:#e2e8f0;font-weight:500}
  .email-preview{padding:24px;flex:1}

  .email-from{padding:14px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:12px;color:#475569}
  .email-from b{color:#0ea5e9}
  .email-body{padding:24px 28px;font-family:Calibri,'Segoe UI',sans-serif;font-size:14px;color:#1e293b;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .email-sig{padding:16px 28px;border-top:2px solid #0ea5e9;background:#f8fafc}
  .email-sig .sig-name{font-size:14px;font-weight:700;color:#1e293b}
  .email-sig .sig-role{font-size:12px;color:#64748b;font-style:italic}
  .email-sig .sig-disc{font-size:10px;color:#94a3b8;margin-top:8px}
  .status-bar{padding:10px 24px;font-size:12px;color:#64748b;border-top:1px solid #334155;background:#1e293b}
  .ejconfig{padding:16px 24px;background:#0c1a2e;border:1px solid #1d4ed8;border-radius:10px;margin:20px 24px;font-size:12px}
  .ejconfig h3{color:#60a5fa;font-size:13px;font-weight:700;margin-bottom:8px}
  .ejconfig p{color:#94a3b8;margin-bottom:8px;line-height:1.6}
  .ejconfig input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:6px 10px;color:#e2e8f0;font-size:12px;margin-bottom:6px;outline:none}
  .ejconfig input:focus{border-color:#38bdf8}
  .setup-hint{color:#fbbf24;font-size:11px;margin-top:4px}
  .progress-bar{height:3px;background:#334155;border-radius:2px;overflow:hidden;margin:0 24px 16px}
  .progress-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#8b5cf6);transition:width .4s;border-radius:2px}
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:#0f172a}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
</style>
</head>

<header>

<div class="layout">

      <div class="icon">✉️</div>

    </div>
  </div>
</div>

const tagClass = {
  'Construcción':'tag-construccion',
  'Diseño + construcción':'tag-diseno',
  'Inversión / renta':'tag-inversion',
  'Especial / técnico':'tag-tecnico'
};

let sent = JSON.parse(localStorage.getItem('ak_sent')||'{}');
let activeFilter = 'all';
let activeIdx = null;
let ejServiceId = localStorage.getItem('ej_service')||'';
let ejTemplateId = localStorage.getItem('ej_template')||'';
let ejPublicKey = localStorage.getItem('ej_pubkey')||'';

function saveSent(){localStorage.setItem('ak_sent',JSON.stringify(sent));}

function setFilter(f,el){
  activeFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function filtered(){
  const q=document.getElementById('search').value.toLowerCase();
  return CONTACTS.filter(c=>{
    const match = !q || c.nombre.toLowerCase().includes(q)||c.email.toLowerCase().includes(q)||(c.ubicacion||'').toLowerCase().includes(q);
    const type = activeFilter==='all'||c.tipo===activeFilter;
    return match&&type;
  });
}

function renderList(){
  const items=filtered();
  const list=document.getElementById('list');
  list.innerHTML=items.map((c,i)=>`
    <div class="contact-item${activeIdx===c.id?' active':''}" onclick="selectContact(${c.id})">
      <div class="name">${c.nombre}</div>
      <div class="email-addr">${c.email}</div>
      <span class="tag ${tagClass[c.tipo]||'tag-construccion'}">${c.tipo}</span>
      ${sent[c.id]?'<span class="sent-badge">✓ Enviado</span>':''}
    </div>`).join('');
  updateStats();
}

function updateStats(){
  const total=CONTACTS.length;
  const sentCount=Object.keys(sent).length;
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-sent').textContent=sentCount;
  document.getElementById('st-pending').textContent=total-sentCount;
}

function selectContact(id){
  activeIdx=id;
  const c=CONTACTS.find(x=>x.id===id);
  renderList();
  const main=document.getElementById('main');
  const sentPct=Math.round(Object.keys(sent).length/CONTACTS.length*100);
  main.innerHTML=`
    <div class="preview-header">
      <div class="pname">${c.nombre}</div>
      <div class="pemail">${c.email}</div>
      <div class="meta-row">
        <span class="meta-pill">${c.tipo}</span>
        ${c.ubicacion?`<span class="meta-pill">📍 ${c.ubicacion}</span>`:''}
        ${c.inicio?`<span class="meta-pill">📅 ${c.inicio}</span>`:''}
        ${sent[c.id]?'<span class="meta-pill" style="color:#4ade80;border-color:#166534">✓ Enviado</span>':''}
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${sentPct}%"></div></div>
    <div class="action-bar">
      <div class="subject-box">
        <label>Asunto:</label>
        <span>${c.asunto}</span>
      </div>
      <button class="btn btn-mailto" onclick="openMailto(${c.id})">✉ Abrir en correo</button>
      <button class="btn btn-primary" id="btn-ej" onclick="sendEmailJS(${c.id})" ${(!ejServiceId||!ejTemplateId||!ejPublicKey)?'disabled title="Configurá EmailJS primero"':''}>⚡ Enviar directo</button>
      ${sent[c.id]?`<button class="btn btn-secondary" onclick="undoSent(${c.id})">↩ Desmarcar</button>`:`<button class="btn btn-success" onclick="markSent(${c.id})">✓ Marcar enviado</button>`}
    </div>
    <div class="email-preview">
      <div class="email-card">
        <div class="email-from">
          <b>De:</b> Leonardo Sánchez | AK Studio &lt;info@akstudio.es&gt;<br>
          <b>Para:</b> ${c.nombre} &lt;${c.email}&gt;<br>
          <b>CC:</b> info@akstudio.es<br>
          <b>Asunto:</b> ${c.asunto}
        </div>
        <div class="email-body">${c.cuerpo}</div>
        <div class="email-sig">
          <div class="sig-name">Leonardo Sánchez</div>
          <div class="sig-role">Director de Arquitectura y Proyectos | AK Studio Arquitectos</div>
          <div class="sig-disc">Aviso de Confidencialidad: Este mensaje va dirigido exclusivamente a su destinatario.</div>
        </div>
      </div>
    </div>
    <div class="ejconfig">
      <h3>⚡ Configuración EmailJS — envío directo desde el navegador</h3>
      <p>Con EmailJS podés enviar correos desde <b>info@akstudio.es</b> directo desde esta página, sin Python ni backend. Es gratis hasta 200 emails/mes.</p>
      <p>1. Creá cuenta en <b>emailjs.com</b> · 2. Conectá tu cuenta Hostinger como servicio SMTP · 3. Pegá los IDs aquí:</p>
      <input id="ej-service" placeholder="Service ID (ej: service_abc123)" value="${ejServiceId}" oninput="saveEJ()">
      <input id="ej-template" placeholder="Template ID (ej: template_xyz456)" value="${ejTemplateId}" oninput="saveEJ()">
      <input id="ej-pubkey" placeholder="Public Key (ej: user_ABC...)" value="${ejPublicKey}" oninput="saveEJ()">
      <p class="setup-hint">💡 El template de EmailJS debe tener las variables: {{to_email}}, {{to_name}}, {{subject}}, {{message}}</p>
    </div>
    <div class="status-bar" id="status">Seleccionado: ${c.nombre} — ${c.email}</div>
  `;
}

function saveEJ(){
  ejServiceId=document.getElementById('ej-service').value.trim();
  ejTemplateId=document.getElementById('ej-template').value.trim();
  ejPublicKey=document.getElementById('ej-pubkey').value.trim();
  localStorage.setItem('ej_service',ejServiceId);
  localStorage.setItem('ej_template',ejTemplateId);
  localStorage.setItem('ej_pubkey',ejPublicKey);
  document.getElementById('btn-ej').disabled=!(ejServiceId&&ejTemplateId&&ejPublicKey);
}

function openMailto(id){
  const c=CONTACTS.find(x=>x.id===id);
  const url=`mailto:${c.email}?cc=info@akstudio.es&subject=${encodeURIComponent(c.asunto)}&body=${encodeURIComponent(c.cuerpo)}`;
  window.open(url);
  document.getElementById('status').textContent='Abriendo cliente de correo... Recordá marcarlo como enviado.';
}

function markSent(id){
  sent[id]=new Date().toISOString();
  saveSent();
  selectContact(id);
  renderList();
}

function undoSent(id){
  delete sent[id];
  saveSent();
  selectContact(id);
  renderList();
}

async function sendEmailJS(id){
  const c=CONTACTS.find(x=>x.id===id);
  const btn=document.getElementById('btn-ej');
  btn.disabled=true;
  btn.textContent='Enviando...';
  document.getElementById('status').textContent='Enviando correo a '+c.email+'...';
  try{
    emailjs.init(ejPublicKey);
    await emailjs.send(ejServiceId,ejTemplateId,{
      to_email:c.email,
      to_name:c.nombre,
      subject:c.asunto,
      message:c.cuerpo,
      from_name:'Leonardo Sánchez | AK Studio',
      reply_to:'info@akstudio.es',
      cc_email:'info@akstudio.es'
    });
    markSent(id);
    document.getElementById('status').textContent='✓ Correo enviado exitosamente a '+c.email;
  }catch(e){
    btn.disabled=false;
    btn.textContent='⚡ Enviar directo';
    document.getElementById('status').textContent='Error: '+e.text||JSON.stringify(e);
  }
}

renderList();
updateStats();
</script>
</body>
</html>
